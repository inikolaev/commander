name: macOS release

on:
  workflow_call:
    secrets:
      APPLE_CERTIFICATE_P12_BASE64:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_TEAM_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
      SPARKLE_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional recovery build number (must exceed all existing release/tag build numbers)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: commander-release
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release_changes.outputs.release }}
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Detect release-affecting changes
        id: release_changes
        uses: ./.github/actions/release-changes
        with:
          base: ${{ github.event_name == 'workflow_dispatch' && '' || format('{0}^', github.sha) }}
          head: ${{ github.sha }}
          force: ${{ github.event_name == 'workflow_dispatch' }}
          paths: |
            Sources/**
            Assets/**
            Package.swift
            Package.resolved
            LICENSE
            THIRD-PARTY-NOTICES.txt
            scripts/build-app.sh
            scripts/app-swiftc.py
            scripts/package-app.sh
            scripts/package-dmg.sh
            scripts/prepare-signing.sh
            scripts/notarize-app.sh
            scripts/notarize-dmg.sh
            scripts/notarize-artifact.sh
            scripts/apple-network-retry.sh
            scripts/sign-app.sh

      - name: Determine next release version
        id: version
        if: steps.release_changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_BUILD: ${{ inputs.build_number }}
        shell: bash
        run: |
          created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          year=${created_at:0:4}
          month=${created_at:5:2}
          if [[ -n "$RECOVERY_BUILD" ]]; then
            [[ "$RECOVERY_BUILD" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'Invalid recovery build number' >&2; exit 1; }
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/used-release-tags.txt"
            gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' >> "$RUNNER_TEMP/used-release-tags.txt"
            highest=$(sed -nE 's/^v[0-9]{4}\.[0-9]{1,2}\.([0-9]+)$/\1/p' "$RUNNER_TEMP/used-release-tags.txt" | sort -n | tail -1)
            (( RECOVERY_BUILD > ${highest:-0} )) || { echo 'Recovery build number must exceed existing releases and tags' >&2; exit 1; }
            build_number=$RECOVERY_BUILD
          else
            latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [[ ! "$latest_tag" =~ ^v[0-9]{4}\.[0-9]{1,2}\.([0-9]+)$ ]]; then
              echo "Latest release tag has unexpected format: $latest_tag" >&2
              exit 1
            fi
            build_number=$((${BASH_REMATCH[1]} + 1))
          fi
          app_version="$year.$((10#$month)).$build_number"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag=v$app_version" >> "$GITHUB_OUTPUT"

  build:
    needs: [changes]
    if: needs.changes.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      APP_VERSION: ${{ needs.changes.outputs.app_version }}
      APP_BUILD_NUMBER: ${{ needs.changes.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Restore Swift release build
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.swiftpm
            .build
          key: swift-release-${{ runner.os }}-${{ matrix.arch }}-xcode26.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-release-${{ runner.os }}-${{ matrix.arch }}-xcode26.2-${{ hashFiles('Package.resolved') }}-

      - name: Import signing and notarization credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/prepare-signing.sh

      - name: Build app
        env:
          CONFIGURATION: release
          SIGN_APP: '0'
        run: |
          bash scripts/build-app.sh "${{ matrix.arch }}"
          file "dist/${{ matrix.arch }}/Commander.app/Contents/MacOS/Commander"
          lipo "dist/${{ matrix.arch }}/Commander.app/Contents/MacOS/Commander" -verify_arch "${{ matrix.arch }}"

      # Preserve the expensive build even if Apple services fail later.
      - name: Save Swift release build
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Sign app
        run: |
          bash scripts/sign-app.sh "dist/${{ matrix.arch }}/Commander.app"
          if [[ "${{ matrix.arch }}" == "$(uname -m)" ]]; then
            "dist/${{ matrix.arch }}/Commander.app/Contents/MacOS/Commander" --verify-bundled-resources
          fi

      - name: Archive signed app for recovery
        run: ditto -c -k --sequesterRsrc --keepParent "dist/${{ matrix.arch }}/Commander.app" "$RUNNER_TEMP/Commander-signed-${{ matrix.arch }}.zip"

      - name: Save signed app for recovery
        uses: actions/upload-artifact@v7
        with:
          name: commander-signed-${{ matrix.arch }}
          overwrite: true
          path: ${{ runner.temp }}/Commander-signed-${{ matrix.arch }}.zip
          retention-days: 3
          if-no-files-found: error

      - name: Notarize and validate app
        run: bash scripts/notarize-app.sh "dist/${{ matrix.arch }}/Commander.app"

      - name: Package ZIP
        env:
          PACKAGE_ONLY: '1'
          NOTARIZE: '1'
        run: bash scripts/package-app.sh "${{ matrix.arch }}"

      - name: Package DMG
        run: bash scripts/package-dmg.sh "${{ matrix.arch }}"

      - name: Notarize and validate DMG
        run: bash scripts/notarize-dmg.sh "dist/Commander-$APP_VERSION-macOS-${{ matrix.arch }}.dmg"

      - name: Verify release checksums
        run: |
          (cd dist && shasum -a 256 -c "Commander-$APP_VERSION-macOS-${{ matrix.arch }}.zip.sha256")
          (cd dist && shasum -a 256 -c "Commander-$APP_VERSION-macOS-${{ matrix.arch }}.dmg.sha256")

      - name: Sign Sparkle update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          dmg="dist/Commander-$APP_VERSION-macOS-${{ matrix.arch }}.dmg"
          tools_dir=$(find .build/artifacts -type d -path '*/Sparkle/bin' -print -quit)
          test -n "$tools_dir"
          signature=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$tools_dir/sign_update" --ed-key-file - "$dmg")
          printf '%s\n' "$signature" > "dist/sparkle-signature-${{ matrix.arch }}.txt"

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p upload
          cp "dist/Commander-$APP_VERSION-macOS-${{ matrix.arch }}.zip" upload/
          cp "dist/Commander-$APP_VERSION-macOS-${{ matrix.arch }}.zip.sha256" upload/
          cp "dist/Commander-$APP_VERSION-macOS-${{ matrix.arch }}.dmg" upload/
          cp "dist/Commander-$APP_VERSION-macOS-${{ matrix.arch }}.dmg.sha256" upload/
          cp "dist/sparkle-signature-${{ matrix.arch }}.txt" upload/

      - uses: actions/upload-artifact@v7
        with:
          name: commander-release-${{ matrix.arch }}
          path: upload/
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing credentials
        if: always()
        run: |
          keychain="$RUNNER_TEMP/commander-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/commander-certificate.p12"

  release:
    needs: [changes, build]
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_VERSION: ${{ needs.changes.outputs.app_version }}
      APP_BUILD_NUMBER: ${{ needs.changes.outputs.build_number }}
      RELEASE_TAG: ${{ needs.changes.outputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Remove stale draft releases
        if: inputs.build_number == ''
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == true) | .tag_name' |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            echo "Deleting stale draft release $tag"
            gh release delete "$tag" --yes
          done

      - uses: actions/download-artifact@v8
        with:
          pattern: commander-release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            if [[ $(jq -r .isDraft "$RUNNER_TEMP/release.json") == false ]]; then
              echo "Release $RELEASE_TAG already exists and is published; refusing to overwrite or republish it." >&2
              exit 1
            fi
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Native macOS builds for Apple silicon (arm64) and Intel (x86_64). Requires macOS 13 or later.

          Choose the DMG matching your Mac. The app is Developer ID signed and notarized by Apple, with the notarization ticket stapled for offline verification.

          Version: $APP_VERSION · Build: $APP_BUILD_NUMBER · Commit: $RELEASE_SHA
          NOTES
            notes_base=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft \
              --title "Commander $APP_VERSION" --generate-notes --notes-start-tag "$notes_base" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" \
            dist/Commander-$APP_VERSION-macOS-arm64.zip \
            dist/Commander-$APP_VERSION-macOS-arm64.zip.sha256 \
            dist/Commander-$APP_VERSION-macOS-arm64.dmg \
            dist/Commander-$APP_VERSION-macOS-arm64.dmg.sha256 \
            dist/Commander-$APP_VERSION-macOS-x86_64.zip \
            dist/Commander-$APP_VERSION-macOS-x86_64.zip.sha256 \
            dist/Commander-$APP_VERSION-macOS-x86_64.dmg \
            dist/Commander-$APP_VERSION-macOS-x86_64.dmg.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Generate Sparkle appcast
        shell: bash
        run: |
          published=$(date -R)
          arm64_dmg="dist/Commander-$APP_VERSION-macOS-arm64.dmg"
          x86_dmg="dist/Commander-$APP_VERSION-macOS-x86_64.dmg"
          arm64_length=$(stat -f%z "$arm64_dmg")
          x86_length=$(stat -f%z "$x86_dmg")
          arm64_signature=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' "dist/sparkle-signature-arm64.txt")
          x86_signature=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' "dist/sparkle-signature-x86_64.txt")
          test -n "$arm64_signature"
          test -n "$x86_signature"
          cat > docs/appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Commander Updates</title>
              <link>https://inikolaev.github.io/commander/appcast.xml</link>
              <description>Commander release updates</description>
              <language>en</language>
              <item>
                <title>Commander $APP_VERSION (Apple silicon)</title>
                <pubDate>$published</pubDate>
                <sparkle:version>$APP_BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$APP_VERSION</sparkle:shortVersionString>
                <sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>
                <enclosure
                  url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$APP_VERSION/Commander-$APP_VERSION-macOS-arm64.dmg"
                  sparkle:edSignature="$arm64_signature"
                  length="$arm64_length"
                  type="application/x-apple-diskimage" />
              </item>
              <item>
                <title>Commander $APP_VERSION (Intel)</title>
                <pubDate>$published</pubDate>
                <sparkle:version>$APP_BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$APP_VERSION</sparkle:shortVersionString>
                <enclosure
                  url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$APP_VERSION/Commander-$APP_VERSION-macOS-x86_64.dmg"
                  sparkle:edSignature="$x86_signature"
                  length="$x86_length"
                  type="application/x-apple-diskimage" />
              </item>
            </channel>
          </rss>
          APPCAST

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy Sparkle feeds and site
        uses: actions/deploy-pages@v5
