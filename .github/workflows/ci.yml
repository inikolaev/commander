name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Cache Swift test build
        uses: actions/cache@v6
        with:
          path: |
            ~/.swiftpm
            .build
          key: swift-test-${{ runner.os }}-xcode26.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-test-${{ runner.os }}-xcode26.2-${{ hashFiles('Package.resolved') }}-

      - name: Test
        run: |
          swift --version
          swift test


  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  preview:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build')
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      APP_VERSION: 0.0.${{ github.run_number }}
      APP_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Cache Swift preview build
        uses: actions/cache@v6
        with:
          path: |
            ~/.swiftpm
            .build
          key: swift-preview-${{ runner.os }}-${{ matrix.arch }}-xcode26.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-preview-${{ runner.os }}-${{ matrix.arch }}-xcode26.2-${{ hashFiles('Package.resolved') }}-

      - name: Build preview
        run: |
          bash scripts/package-app.sh "${{ matrix.arch }}"
          file "dist/${{ matrix.arch }}/Commander.app/Contents/MacOS/Commander"
          lipo "dist/${{ matrix.arch }}/Commander.app/Contents/MacOS/Commander" -verify_arch "${{ matrix.arch }}"
          codesign --verify --deep --strict "dist/${{ matrix.arch }}/Commander.app"

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: Commander-PR-${{ github.event.pull_request.number }}-${{ matrix.arch }}
          path: |
            dist/Commander-$APP_VERSION-macOS-${{ matrix.arch }}.zip
            dist/Commander-$APP_VERSION-macOS-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 7


  preview-comment:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build') && github.event.pull_request.head.repo.full_name == github.repository
    needs: [preview]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Prepare preview download comment
        shell: bash
        run: |
          arm64_name="Commander-PR-$PR_NUMBER-arm64"
          x86_name="Commander-PR-$PR_NUMBER-x86_64"

          arm64_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"$arm64_name\") | .id" | head -1)
          x86_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"$x86_name\") | .id" | head -1)

          test -n "$arm64_id"
          test -n "$x86_id"

          arm64_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$arm64_id"
          x86_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$x86_id"
          short_sha="${GITHUB_SHA:0:7}"

          cat > "$RUNNER_TEMP/preview-comment.md" <<COMMENT
          <!-- commander-preview-build -->
          ### Commander preview build

          - [Download Apple Silicon (arm64)]($arm64_url)
          - [Download Intel (x86_64)]($x86_url)

          Built from \`$short_sha\` · [CI run #$GITHUB_RUN_NUMBER](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          Artifacts are retained for 7 days.
          COMMENT

      - name: Update preview download comment
        uses: ./.github/actions/sticky-comment
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          marker: '<!-- commander-preview-build -->'
          body-file: ${{ runner.temp }}/preview-comment.md
